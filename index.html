<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        
        // Your Tamkeen Bank Store URLs
        var androidUrl = "https://play.google.com/store/apps/details?id=com.AamalTech.tamkeenbank";
        var iosUrl = "https://apps.apple.com/us/app/tamkeen-bank/id6499384741";

        if (/android/i.test(userAgent)) {
            window.location.replace(androidUrl);
        } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            window.location.replace(iosUrl);
        } else {
            // Default for desktop users
            window.location.replace(iosUrl);
        }
    </script>
</head>
<body>
    <p>Redirecting to the App Store...</p>
</body>
</html>
